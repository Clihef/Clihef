<svg xmlns="http://www.w3.org/2000/svg" width="800" height="168" viewBox="0 0 800 168" role="img" aria-labelledby="title desc">
  <title id="title">GitHub activity for Clihef</title>
  <desc id="desc">GitHub contributions for the last 12 months: Commits 40, Pull requests 9, Issues 1, Contributed to 2.</desc>
  <style>
    .title { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .period, .label { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #57606a; }
    .value { font: 600 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #24292f; }
    .divider { stroke: #d0d7de; stroke-width: 1; }
  </style>
  <rect x="0.5" y="0.5" width="799" height="167" rx="8" fill="#ffffff" stroke="#d0d7de" />
  <rect x="28" y="23" width="3" height="16" rx="1.5" fill="#0969da" />
  <text x="40" y="36" class="title">GitHub Activity</text>
  <text x="772" y="36" class="period" text-anchor="end">Last 12 months</text>
  <line x1="28" y1="52" x2="772" y2="52" class="divider" />
  <g>
    <text x="175" y="98" class="value" text-anchor="middle">40</text>
    <text x="175" y="122" class="label" text-anchor="middle">Commits</text>
    <line x1="250" y1="68" x2="250" y2="136" class="divider" />
    <text x="325" y="98" class="value" text-anchor="middle">9</text>
    <text x="325" y="122" class="label" text-anchor="middle">Pull requests</text>
    <line x1="400" y1="68" x2="400" y2="136" class="divider" />
    <text x="475" y="98" class="value" text-anchor="middle">1</text>
    <text x="475" y="122" class="label" text-anchor="middle">Issues</text>
    <line x1="550" y1="68" x2="550" y2="136" class="divider" />
    <text x="625" y="98" class="value" text-anchor="middle">2</text>
    <text x="625" y="122" class="label" text-anchor="middle">Contributed to</text>
  </g>
</svg>
